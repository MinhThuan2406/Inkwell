name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for tracked sensitive files and secret patterns
        run: |
          set -euo pipefail
          FORBIDDEN_FILES=$(git ls-files | grep -E '(^|/)\.env($|\.(?!example$))|\.(pem|key|p12|pfx|jks|keystore)$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Sensitive environment or private key files are tracked in Git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          SECRET_MATCHES=$(git grep -I -n -E '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|sk-[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----)' -- . ':(exclude).github/workflows/*' || true)
          if [ -n "$SECRET_MATCHES" ]; then
            echo "::error::Potential hardcoded credentials or private keys detected in tracked files."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
